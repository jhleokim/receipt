<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영수증 촬영 전송</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:#F6F1E7; color:#2B2B28;
    font-family:'IBM Plex Mono', monospace;
    display:flex; flex-direction:column; align-items:center;
    padding:48px 20px; text-align:center;
  }
  h1{font-size:20px; letter-spacing:.06em; margin:0 0 8px;}
  p{color:#8B8172; font-size:13px; line-height:1.6; max-width:320px; margin:0 0 26px;}
  .pick-row{display:flex; gap:14px;}
  label.pick{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    width:140px; height:140px; border:2px dashed #B3312C; border-radius:12px;
    color:#B3312C; font-size:13px; font-weight:600; cursor:pointer; background:#fffdf8;
  }
  label.pick span.icon{font-size:34px; margin-bottom:8px;}
  input[type=file]{display:none;}
  #status{margin-top:18px; font-size:13px; min-height:18px; color:#3C7A4B;}
  #status.err{color:#B3312C;}
  #thumbs{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:18px; max-width:340px;}
  #thumbs img{width:64px; height:64px; object-fit:cover; border-radius:6px; border:1px solid #D9D0BC;}
  #verTag{
    position:fixed; bottom:10px; right:12px;
    font-size:10px; color:#B3AB9C; letter-spacing:.04em;
    border:1px solid #D9D0BC; border-radius:3px; padding:1px 7px;
  }
</style>
</head>
<body>
  <span id="verTag">v1.1</span>
  <h1>영수증 촬영</h1>
  <p id="hint">촬영하거나 갤러리에서 선택하면 PC 화면으로 바로 전송돼요. 여러 장 계속 올릴 수 있어요.</p>
  <div class="pick-row" id="pickRow">
    <label class="pick">
      <span class="icon">📷</span>
      사진 촬영
      <input type="file" id="fCamera" accept="image/*" capture="environment">
    </label>
    <label class="pick">
      <span class="icon">🖼️</span>
      사진 선택
      <input type="file" id="fGallery" accept="image/*">
    </label>
  </div>
  <div id="status"></div>
  <div id="thumbs"></div>

<script>
  const params = new URLSearchParams(location.search);
  const session = params.get('s');
  const status = document.getElementById('status');
  const thumbs = document.getElementById('thumbs');

  if (!session) {
    document.getElementById('hint').textContent = '잘못된 접근이에요. PC 화면의 QR코드를 다시 스캔해주세요.';
    document.getElementById('pickRow').style.display = 'none';
  }

  async function handleFile(input){
    const file = input.files[0];
    input.value = '';
    if (!file) return;

    status.className = '';
    status.textContent = '전송 중…';

    try {
      const fd = new FormData();
      fd.append('file', file, file.name || 'photo.jpg');
      const res = await fetch('/api/upload?s=' + encodeURIComponent(session), {
        method: 'POST',
        body: fd
      });
      if (!res.ok) throw new Error('실패');

      status.className = '';
      status.textContent = '전송 완료 ✓ 계속 보낼 수 있어요';

      const img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      thumbs.appendChild(img);
    } catch (err) {
      status.className = 'err';
      status.textContent = '전송 실패, 다시 시도해주세요';
    }
  }

  document.getElementById('fCamera').addEventListener('change', (e) => handleFile(e.target));
  document.getElementById('fGallery').addEventListener('change', (e) => handleFile(e.target));
</script>
</body>
</html>
